name: Build calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "calendar.ics"
      - "calendar_state.json"
      - "feeds.json"
      - ".github/workflows/calendar.yml"
      - "tools/**"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  normalize-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync sports calendars
        run: python tools/sync_playmetrics.py

      - name: Normalize calendar
        run: python tools/normalize_ics.py

      - name: Open issue for calendar changes
        if: ${{ hashFiles('calendar_changes.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('calendar_changes.md', 'utf8').trim();
            if (!body) {
              core.info('No calendar changes to report.');
              return;
            }

            const firstLine = body.split('\n').find(line => line.startsWith('Added:'));
            const secondLine = body.split('\n').find(line => line.startsWith('Updated:'));
            const thirdLine = body.split('\n').find(line => line.startsWith('Deleted:'));
            const title = `Williams Family AI updated calendar changes detected (${firstLine}, ${secondLine}, ${thirdLine})`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              assignees: [context.repo.owner]
            });

      - name: Commit calendar changes if needed
        id: commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar.ics calendar_state.json
            git commit -m "Sync calendar.ics"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Commits made with GITHUB_TOKEN do not trigger pages.yml. Publish from
      # this job so the public subscription always matches the synced calendar.
      - name: Build Pages artifact
        if: ${{ github.event_name != 'schedule' || steps.commit.outputs.changed == 'true' }}
        run: |
          mkdir -p _site
          cp calendar.ics _site/calendar.ics
          cp site/index.html _site/index.html

      - name: Configure Pages
        if: ${{ github.event_name != 'schedule' || steps.commit.outputs.changed == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'schedule' || steps.commit.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        if: ${{ github.event_name != 'schedule' || steps.commit.outputs.changed == 'true' }}
        uses: actions/deploy-pages@v4
