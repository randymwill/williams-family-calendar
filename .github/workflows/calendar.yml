name: Build calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "calendar.ics"
      - "calendar_state.json"
      - ".github/workflows/calendar.yml"
      - "tools/**"

permissions:
  contents: write
  issues: write

jobs:
  normalize-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync sports calendars
        run: python tools/sync_playmetrics.py

      - name: Normalize calendar
        run: python tools/normalize_ics.py

      - name: Open issue for calendar changes
        if: ${{ hashFiles('calendar_changes.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('calendar_changes.md', 'utf8').trim();
            if (!body) {
              core.info('No calendar changes to report.');
              return;
            }

            const firstLine = body.split('\n').find(line => line.startsWith('Added:'));
            const secondLine = body.split('\n').find(line => line.startsWith('Updated:'));
            const thirdLine = body.split('\n').find(line => line.startsWith('Deleted:'));
            const title = `Williams Family AI updated calendar changes detected (${firstLine}, ${secondLine}, ${thirdLine})`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Commit calendar changes if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar.ics calendar_state.json
            git commit -m "Sync calendar.ics"
            git push
          fi
